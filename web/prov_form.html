<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>连接 Wi-Fi · Glance</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#fafbf9;color:#262c24;font:16px/1.6 -apple-system,system-ui,"Microsoft YaHei",sans-serif}.card{width:100%;max-width:440px}.brand{font-size:28px;font-weight:650;letter-spacing:-1px;color:#4c6540;margin-bottom:48px}h1{font-size:28px;letter-spacing:-.5px;margin:0 0 12px}.sub{color:#73796f;margin:0 0 32px}label{display:block;font-size:14px;font-weight:600;margin:22px 0 8px}input{width:100%;padding:12px;border:1px solid #dde2d8;border-radius:8px;background:#fff;font:inherit;color:inherit}input:focus{outline:2px solid #889c77;outline-offset:2px}button{width:100%;margin-top:28px;padding:13px;border:0;border-radius:8px;background:#4c6540;color:#fff;font:600 16px system-ui;cursor:pointer}button:hover{background:#3f5634}.foot{margin-top:28px;border-top:1px solid #e4e7e0;padding-top:20px;color:#73796f;font-size:12px;overflow-wrap:anywhere}
