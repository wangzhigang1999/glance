name: Firmware logic tests
on: [push, pull_request, workflow_call]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo +stable test --locked --manifest-path tests/host/Cargo.toml --target x86_64-unknown-linux-gnu --target-dir target/host-tests
